# Dialectic ships for Windows only. Pushing a `v*` tag builds an installer and a portable zip and
# publishes a GitHub release; running the workflow by hand builds them and keeps them as an artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup installs it on the first cargo call.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          # Named after the Cargo.toml version: github.ref_name can be a branch with a slash in it.
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          # Terminals pick dialectic.com over dialectic.exe, so the console build serves the CLI.
          Copy-Item target/release/dialectic-console.exe target/release/dialectic.com
          Compress-Archive -Path target/release/dialectic.exe, target/release/dialectic.com, LICENSE, README.md, CHANGELOG.md `
            -DestinationPath dist/dialectic-$version-windows-x86_64.zip
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\dialectic.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: dialectic-windows-x86_64
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --title "${{ github.ref_name }}" --notes "See CHANGELOG.md."
