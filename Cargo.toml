[package]
name = "dialectic"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/namzug16/dialectic"
description = "Local Git pull requests: open, review and merge branches of one repository on one machine."

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
dirs = "7.0.0"
# Rune is pre-release: pin one `dev` revision and use it for Rune, rune-kit and every patch below.
rune = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721", features = ["markdown"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde_json = "1.0.154"

# Copied from Rune's root Cargo.toml at the same rev: a dependency's [patch] doesn't apply to its dependents.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "842c28c2ca5dd1506c1e4a67052db61800aed721" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dev-dependencies]
tempfile = "3.27.0"
