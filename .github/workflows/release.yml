# Dialectic ships for Windows only. Pushing a `v*` tag builds dialectic.exe and publishes a
# GitHub release; running the workflow by hand builds it and keeps it as a workflow artifact.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup installs it on the first cargo call.
      - run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/release/dialectic.exe, LICENSE, README.md, CHANGELOG.md `
            -DestinationPath dist/dialectic-${{ github.ref_name }}-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: dialectic-windows-x86_64
          path: dist/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/*.zip --title "${{ github.ref_name }}" --notes "See CHANGELOG.md."
